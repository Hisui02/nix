[bar.default]
end = [ "tray", "notifications", "cpu", "ram", "wallhaven_2", "battery" ]
margin_edge = 0
margin_ends = 0
position = "right"
radius = 0
start = [ "network", "bluetooth", "workspaces" ]

[battery]
warning_threshold = 20

[calendar]
enabled = true
refresh_minutes = 120

    [calendar.account.personal_google]
    name = "Calendar"
    type = "google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1536.0
    cy = 1609.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/hisui/.avatar.jpg"

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "bed-filled"
    label = "Hibernate"
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "feishin", "zen-browser", "neovim", "steam", "fastfetch", "bat", "lazygit", "yazi" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/hisui/Pictures/Wallpapers/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/hisui/Pictures/Wallpapers/wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/hisui/Pictures/Wallpapers/wallpaper.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/hisui/Pictures/Wallpapers/wallpaper.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-tonal-spot"

[widget.cpu]
show_label = false

[widget.media]
hide_when_no_media = true
scale = 1.5

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.tray]
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_2]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
display = "none"
labels_only_when_occupied = true
