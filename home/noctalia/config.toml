[bar.default]
end = [ "tray", "notifications", "clipboard", "battery", "session" ]
margin_edge = 5
margin_ends = 0
position = "right"
start = [ "network", "bluetooth", "media", "workspaces" ]

[battery]
warning_threshold = 20

[calendar]
enabled = true
refresh_minutes = 120

    [calendar.account.personal_google]
    name = "Calendar"
    type = "google"

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell.screenshot]
save_to_file = false

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "zen-browser" ]

[wallpaper.default]
path = "/home/hisui/Pictures/Wallpapers/wallhaven_o5zo2l.jpg"

[wallpaper.last]
path = "/home/hisui/Pictures/Wallpapers/wallhaven_o5zo2l.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/hisui/Pictures/Wallpapers/wallhaven_o5zo2l.jpg"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.workspaces]
display = "none"
labels_only_when_occupied = true
