$BROWSER=brave
$EDITOR=codium

exec-once = iio-hyprland

monitor=eDP-1, highres@highrr, auto, 1.2
monitor=, highres@highrr, auto-right, 1.2

unbind = Ctrl+Shift, Escape,
bind = Ctrl+Shift, Escape, exec, kitty -o allow_remote_control=yes sh -c 'kitten @ set-spacing padding=0; btop' #btop

bind = $mainMod, M, exec, $scrPath/custom-monitor.sh #Switch second monitor

bind = $mainMod, O, exec, obsidian #Obsidian

unbind = $mainMod, F
bind = $mainMod, B, exec, $BROWSER #Brave

unbind = $mainMod, C
bind = $mainMod, C, exec, $EDITOR #VS Codium

windowrulev2 = unset,class:^(vlc)$ # Fix vlc sizing

# Fixing discord popout
windowrulev2 = float,initialTitle:Discord Popout
windowrulev2 = pin,initialTitle:Discord Popout
windowrulev2 = opacity 1,initialTitle:Discord Popout
windowrulev2 = size 500 300,initialTitle:Discord Popout
windowrulev2 = move onscreen 100% 0,initialTitle:Discord Popout

# Changing mouse workspace scrolling to below as the keyboard one doesss
unbind = $mainMod, mouse_down
unbind = $mainMod, mouse_up
bindd = $mainMod, mouse_down, $d next workspace, workspace, r+1
bindd = $mainMod, mouse_up, $d previous workspace, workspace, r-1
binds:scroll_event_delay = 0

# Fixing browser fullscreen
windowrulev2 = fullscreenstate 2 0,class:^(Brave-browser)$ #Fullscreens the application and keeps the client in non-fullscreen mode.
# windowrulev2 = fullscreenstate 0 2,class:^(Brave-browser)$ #Keeps the window non-fullscreen, but the client goes into fullscreen mode within the window.

input {
    kb_layout = es,us
    kb_variant = ,intl

    touchpad {
        natural_scroll = yes
    }
}